<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Air Quality</h1>
        <label>City
            <span class="ac">
                <input id="place" type="text" autocomplete="off" spellcheck="false"
                       placeholder="Start typing a city…" role="combobox"
                       aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
                <ul id="suggest" role="listbox" hidden></ul>
            </span>
        </label>
        <button id="saveFavorite" type="button" disabled>☆ Save favorite</button>
        <div id="favoritesSection">
            <strong>Favorite cities</strong>
            <ul id="favorites"></ul>
        </div>
        <button id="loadView" type="button">Load current map view</button>
        <p id="status">Type a city and pick it from the list, or pan and zoom the map and press “Load current map view”.</p>
        <p id="perf" hidden></p>
        <p id="storage" hidden></p>
    </header>
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="js/geographical_data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
